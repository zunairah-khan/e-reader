<!DOCTYPE html>
<html>
<head>
  <title>Zunairah's Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--Google fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <style>
    body { font-family: Outfit; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #b2d5e5; color: #020202; }
    h1 { border-bottom: 1px solid #444; padding-bottom: 10px; color: #444; }
    div { margin-bottom: 10px; color: #020202; }
    .upload-text { font-size: 14px; color: #020202; margin-bottom: 6px; }
    .book { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
    .book-info { flex: 1; }
    .book-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .progress-bar { height: 4px; background: #f7ffde; margin-top: 6px; border-radius: 2px; }
    .progress-fill { height: 4px; background: #b93100; border-radius: 2px; }
    .pct { font-size: 12px; color: #020202; margin-top: 4px; }
    .del { color: #b93100; text-decoration: none; font-size: 12px; margin-left: 16px; }
    .upload-area { margin-top: 30px; border: 1px dashed #444; padding: 10px; border-radius: 2px; color: #444; background: #b2d5e5; }
    input[type=file] { color: #eee; }
    button { background: #b93100; color: #f7ffde; border: none; padding: 10px 20px; cursor: pointer; font-family: Outfit; font-size: 14px; margin-top: 10px; border-radius: 4px; }
    button:hover { background: #8a2500; }
  </style>
</head>
<body>
  <h1>E-READER LIBRARY</h1>

  {% if library %} 
    {% for book in library %}
    <div class="book">
      <div class="book-info">
        <div class="book-name">{{ book.name }}</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: {{ book.pct }}%"></div>
        </div>
        <div class="pct">{{ book.pct }}% complete</div>
      </div>
      <a class="del" href="/delete/{{ book.file }}">[remove]</a>
    </div>
    {% endfor %}
  {% else %}
    <p style="color:#555">No books yet. Upload one below.</p>
  {% endif %}

  <div class="upload-area">
    <form method="post" action="/upload" enctype="multipart/form-data">
      <div class="upload-text">Upload EPUB</div>
      <input type="file" name="book" accept=".epub"><br>
      <button type="submit">Upload</button>
    </form>
  </div>

  <div class="upload-area">
  <form method="post" action="/upload-screensaver" enctype="multipart/form-data">
    <div>Screensaver Image</div>
    <p style="color:#888; font-size:12px; margin: 4px 0">
      Displayed when device powers off. Will be converted to black and white.
    </p>
    <input type="file" name="screensaver" accept=".png,.jpg,.jpeg,.bmp"><br>
    <button type="submit">[ UPLOAD SCREENSAVER ]</button>
  </form>
</div>
</body>
</html>
